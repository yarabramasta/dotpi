[project]
name = "dotpi"
version = "0.1.0"
description = "Safe installer and backup tool for this repository's Pi configuration."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dotpi = "dotpi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dotpi"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.format]
quote-style = "double"
